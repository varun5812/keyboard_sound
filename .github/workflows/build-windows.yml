name: Build TypeFlow Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/TypeFlow-Setup.exe
          generate_release_notes: true

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeFlow-Windows-Installer
          path: release/TypeFlow-Setup.exe
          if-no-files-found: error
          retention-days: 30
