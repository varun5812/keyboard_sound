name: Build TypeFlow Windows Installer

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Verify installer output
        shell: pwsh
        run: |
          if (-not (Test-Path -Path "release/TypeFlow-Setup.exe")) {
            Write-Error "Installer binary release/TypeFlow-Setup.exe was not found!"
            exit 1
          }
          $installer = Get-Item "release/TypeFlow-Setup.exe"
          Write-Host "Found installer: $($installer.FullName)"
          Write-Host "File size: $([math]::Round($installer.Length / 1MB, 2)) MB ($($installer.Length) bytes)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeFlow-Windows-Installer
          path: release/TypeFlow-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/TypeFlow-Setup.exe
          name: TypeFlow ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
